aid: aspire
name: Aspire
description: >-
  Aspire is a Singapore-headquartered fintech offering an all-in-one finance
  platform for growing businesses operating globally. Its products include
  multi-currency business accounts, corporate cards, global payments and FX,
  expense and budget management, bill pay, bulk payments, invoice and
  accounts-receivable management, yield on idle balances, and global payroll.
  Aspire also exposes a developer API (api.aspireapp.com/public/v1) covering
  payouts/transfers, card issuance, and bank-feed/transaction reporting, secured
  with OAuth 2.0 bearer tokens (client-credentials and authorization-code + PKCE
  flows), idempotency keys, and webhooks. The company serves 50,000+ businesses,
  is backed by Lightspeed Venture Partners, and is PCI DSS v4.0.1, ISO/IEC
  27001:2022, and SOC 2 Type 2 certified.
